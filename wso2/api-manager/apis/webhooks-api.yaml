openapi: 3.1.0
info:
  title: Webhooks API
  version: '1.0.0'
  description: API expuesta vía WSO2 API Manager para la plataforma de telemedicina.
servers:
  - url: https://api.telemedicina.mx/webhooks/1.0.0
security:
  - bearerAuth: []
paths:
  '/register':
    post:
      operationId: register
      summary: POST /register
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  '/{id}/test':
    post:
      operationId: id_test
      summary: POST /{id}/test
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by WSO2 Identity Server
x-wso2-production-endpoints:
  urls:
    - http://wso2-mi:8290/webhooks
x-wso2-cors:
  accessControlAllowOrigins: ['*']
  accessControlAllowHeaders: ['authorization', 'Content-Type', 'X-Correlation-Id']
  accessControlAllowMethods: ['GET', 'POST', 'PATCH', 'PUT', 'DELETE']

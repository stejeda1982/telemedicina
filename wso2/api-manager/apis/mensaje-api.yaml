openapi: 3.1.0
info:
  title: Mensaje API
  version: '1.0.0'
  description: API expuesta vía WSO2 API Manager para la plataforma de telemedicina.
servers:
  - url: https://api.telemedicina.mx/mensaje/1.0.0
security:
  - bearerAuth: []
paths:
  '/conversaciones':
    post:
      operationId: conversaciones
      summary: POST /conversaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  '/conversaciones/{id}/mensajes':
    post:
      operationId: conversaciones_id_mensajes
      summary: POST /conversaciones/{id}/mensajes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  '/conversaciones':
    get:
      operationId: conversaciones
      summary: GET /conversaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by WSO2 Identity Server
x-wso2-production-endpoints:
  urls:
    - http://wso2-mi:8290/mensaje
x-wso2-cors:
  accessControlAllowOrigins: ['*']
  accessControlAllowHeaders: ['authorization', 'Content-Type', 'X-Correlation-Id']
  accessControlAllowMethods: ['GET', 'POST', 'PATCH', 'PUT', 'DELETE']

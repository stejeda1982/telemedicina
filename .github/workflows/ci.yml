name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-services:
    name: Build & lint services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - servicio-identidad
          - servicio-pacientes
          - servicio-profesionales
          - servicio-agenda
          - servicio-video
          - servicio-expediente
          - servicio-recetas
          - servicio-pagos
          - servicio-mensajeria
          - servicio-notificaciones
          - servicio-integraciones
          - servicio-auditoria
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.service }} run prisma:generate
      - run: pnpm --filter ${{ matrix.service }} run build
      - run: pnpm --filter ${{ matrix.service }} run lint

  build-bff:
    name: Build BFF
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bff: [bff-paciente, bff-profesional, bff-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.bff }} run build

  docker-images:
    name: Build Docker images
    needs: [build-services, build-bff]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: servicio-identidad, port: 3001 }
          - { service: servicio-pacientes, port: 3002 }
          - { service: servicio-profesional, port: 3003 }
          - { service: servicio-agenda, port: 3004 }
          - { service: servicio-video, port: 3005 }
          - { service: servicio-expediente, port: 3006 }
          - { service: servicio-recetas, port: 3007 }
          - { service: servicio-pagos, port: 3008 }
          - { service: servicio-mensajeria, port: 3009 }
          - { service: servicio-notificaciones, port: 3010 }
          - { service: servicio-integraciones, port: 3011 }
          - { service: servicio-auditoria, port: 3012 }
          - { service: bff-paciente, port: 4001 }
          - { service: bff-profesional, port: 4002 }
          - { service: bff-admin, port: 4003 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ghcr.io/stejeda1982/telemedicina/${{ matrix.service }}:${{ github.sha }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-identidad
  namespace: core
  labels: { service: identidad, tier: services }
spec:
  replicas: 2
  selector:
    matchLabels: { service: identidad }
  template:
    metadata:
      labels: { service: identidad }
    spec:
      containers:
        - name: identidad
          image: ghcr.io/stejeda1982/telemedicina/servicio-identidad:1.0.0
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef: { name: servicio-identidad-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/identidad/health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/identidad/health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-identidad
  namespace: core
spec:
  selector: { service: identidad }
  ports:
    - port: 3001
      targetPort: 3001

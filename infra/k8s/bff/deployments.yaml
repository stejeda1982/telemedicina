---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-paciente
  namespace: bff
  labels: { bff: paciente, tier: edge }
spec:
  replicas: 3
  selector:
    matchLabels: { bff: paciente }
  template:
    metadata:
      labels: { bff: paciente }
    spec:
      containers:
        - name: bff-paciente
          image: ghcr.io/stejeda1982/telemedicina/bff-paciente:1.0.0
          ports: [{ containerPort: 4001 }]
          envFrom: [secretRef: { name: bff-paciente-secrets }]
          readinessProbe:
            httpGet: { path: /api/v1/bff/paciente/health, port: 4001 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bff-paciente
  namespace: bff
spec:
  selector: { bff: paciente }
  ports: [{ port: 4001, targetPort: 4001 }]
